name: Problem with replies, docs or examples
description: A tool reply looks wrong, a connection step doesn't work, or an example fails.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **In a medical emergency, call 911.** This project can't help in an emergency.
        This is a public page. **Don't include anything about a patient** (names, dates of birth, insurance IDs, health details) or an account key.
        To correct a specific doctor's details, use [Corrections and removal](https://findadoctor.si/us/corrections/) instead.
        Posted something by mistake? Edit or delete your issue. If it showed an account key, email contact@findadoctor.si so we can turn the key off.
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Connecting a client (MCP)
        - HTTP API
        - A tool reply
        - Docs
        - Examples
        - Agent Skill
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      placeholder: e.g. Claude Code 2.1, Cursor 1.x, Python mcp 2.3.0
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The request (tool and parameters, or the URL) and the part of the reply that looks wrong. Use a general or made-up example if it shows the same problem. Don't paste chat transcripts, whole replies or screenshots that show someone's health details, and leave out any account key.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no patient information (including my own health details) and no account key.
          required: true
